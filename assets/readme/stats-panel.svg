<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">GitHub profile signal</title>
  <desc id="description">Automated live GitHub data presented as four real cards in a two by two grid with a daily refresh cycle.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="54%" stop-color="#081421" />
      <stop offset="100%" stop-color="#102238" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#2dd4bf" />
      <stop offset="78%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27415e" stroke-width="1" opacity="0.34" />
    </pattern>
    <clipPath id="frameClip"><rect width="1200" height="300" rx="20" /></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#background)" />
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#345778" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="url(#grid)" opacity="0.18" />
  <rect x="28" y="24" width="1144" height="252" rx="17" fill="#060d17" fill-opacity="0.64" stroke="#2f648b" stroke-width="1.4" />
  <rect x="29" y="25" width="1142" height="250" rx="16" fill="none" stroke="#3b82f6" stroke-opacity="0.22" />
  <g clip-path="url(#frameClip)">
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 360" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="28" y="273" width="1144" height="3" rx="1.5" fill="url(#edge)" opacity="0.5" />
  <circle cx="52" cy="56" r="4.5" fill="#3b82f6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <text x="68" y="62" fill="#3b82f6" font-size="16" font-weight="800" font-family="Consolas, Menlo, monospace">PROFILE SIGNAL // LIVE GITHUB DATA</text>
  <text x="52" y="88" fill="#8fa3ba" font-size="13" font-family="Consolas, Menlo, monospace">richard@portfolio:~$ read profile.signal --live</text>
  <text x="1148" y="62" fill="#5f7590" font-size="12" text-anchor="end" font-family="Consolas, Menlo, monospace">AUTOMATION // HEALTHY</text>
  <line x1="52" y1="105" x2="1148" y2="105" stroke="#315474" stroke-width="1" />
  <line x1="52" y1="105" x2="210" y2="105" stroke="url(#edge)" stroke-width="2" />
  <rect x="52" y="137" width="250" height="90" rx="13" fill="#0b1726" stroke="#22d3ee" stroke-opacity="0.5" />
  <text x="74" y="172" fill="#22d3ee" font-size="19" font-weight="800" font-family="Consolas, Menlo, monospace">AUTOMATED</text>
  <text x="74" y="197" fill="#8fa3ba" font-size="12" font-weight="700" font-family="Consolas, Menlo, monospace">LOCAL CARDS</text>
  <rect x="74" y="209" width="206" height="4" rx="2" fill="#1c2a3b" />
  <rect x="74" y="209" width="87" height="4" rx="2" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="327" y="137" width="250" height="90" rx="13" fill="#0b1726" stroke="#2dd4bf" stroke-opacity="0.5" />
  <text x="349" y="172" fill="#2dd4bf" font-size="19" font-weight="800" font-family="Consolas, Menlo, monospace">4 CARDS</text>
  <text x="349" y="197" fill="#8fa3ba" font-size="12" font-weight="700" font-family="Consolas, Menlo, monospace">REAL DATA</text>
  <rect x="349" y="209" width="206" height="4" rx="2" fill="#1c2a3b" />
  <rect x="349" y="209" width="111" height="4" rx="2" fill="#2dd4bf" opacity="0.8">
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="3.4s" repeatCount="indefinite" />
  </rect>
  <rect x="602" y="137" width="250" height="90" rx="13" fill="#0b1726" stroke="#3b82f6" stroke-opacity="0.5" />
  <text x="624" y="172" fill="#3b82f6" font-size="19" font-weight="800" font-family="Consolas, Menlo, monospace">2 x 2</text>
  <text x="624" y="197" fill="#8fa3ba" font-size="12" font-weight="700" font-family="Consolas, Menlo, monospace">GRID LAYOUT</text>
  <rect x="624" y="209" width="206" height="4" rx="2" fill="#1c2a3b" />
  <rect x="624" y="209" width="136" height="4" rx="2" fill="#3b82f6" opacity="0.8">
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="3.8s" repeatCount="indefinite" />
  </rect>
  <rect x="877" y="137" width="250" height="90" rx="13" fill="#0b1726" stroke="#8b5cf6" stroke-opacity="0.5" />
  <text x="899" y="172" fill="#8b5cf6" font-size="19" font-weight="800" font-family="Consolas, Menlo, monospace">DAILY</text>
  <text x="899" y="197" fill="#8fa3ba" font-size="12" font-weight="700" font-family="Consolas, Menlo, monospace">REFRESH CYCLE</text>
  <rect x="899" y="209" width="206" height="4" rx="2" fill="#1c2a3b" />
  <rect x="899" y="209" width="161" height="4" rx="2" fill="#8b5cf6" opacity="0.8">
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="4.2s" repeatCount="indefinite" />
  </rect>

</svg>
