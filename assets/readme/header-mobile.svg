<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title description">
  <title id="title">Richard technical profile banner</title>
  <desc id="description">David Ricardo Carvajal Barragán, Systems and Computer Engineering Student from Bucaramanga, Colombia.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="58%" stop-color="#0a1728" />
      <stop offset="100%" stop-color="#10243a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="52%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#28415e" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="430" rx="20" fill="url(#background)" />
  <rect x="1" y="1" width="598" height="428" rx="19" fill="none" stroke="#33506f" stroke-width="2" />
  <rect x="1" y="1" width="598" height="428" rx="19" fill="url(#grid)" opacity="0.28" />

  <rect x="0" y="0" width="3" height="430" fill="#22d3ee" opacity="0.13">
    <animate attributeName="x" values="0;597;0" dur="12s" repeatCount="indefinite" />
  </rect>

  <rect x="190" y="35" width="220" height="34" rx="17" fill="#0b2435" stroke="#22d3ee" stroke-width="1" />
  <circle cx="214" cy="52" r="5" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <text x="232" y="59" fill="#b7e8f2" font-size="14" font-weight="700" font-family="Segoe UI, Ubuntu, Arial, sans-serif">PROFILE // STUDENT</text>

  <text x="300" y="148" fill="#f0f6fc" font-size="62" font-weight="800" text-anchor="middle" font-family="Segoe UI, Ubuntu, Arial, sans-serif">RICHARD</text>
  <rect x="104" y="168" width="392" height="5" rx="2.5" fill="url(#accent)" filter="url(#glow)" />
  <text x="300" y="215" fill="#42d7ee" font-size="21" font-weight="700" text-anchor="middle" font-family="Segoe UI, Ubuntu, Arial, sans-serif">SYSTEMS &amp; COMPUTER ENGINEERING</text>
  <text x="300" y="245" fill="#42d7ee" font-size="21" font-weight="700" text-anchor="middle" font-family="Segoe UI, Ubuntu, Arial, sans-serif">STUDENT</text>
  <text x="300" y="286" fill="#d3ddea" font-size="19" font-weight="600" text-anchor="middle" font-family="Segoe UI, Ubuntu, Arial, sans-serif">David Ricardo Carvajal Barragán</text>
  <text x="300" y="319" fill="#95a9c2" font-size="17" text-anchor="middle" font-family="Segoe UI, Ubuntu, Arial, sans-serif">Bucaramanga, Colombia</text>

  <rect x="94" y="352" width="412" height="44" rx="12" fill="#07111f" stroke="#365372" />
  <text x="120" y="380" fill="#2dd4bf" font-size="16" font-family="Consolas, Menlo, monospace">&gt;</text>
  <text x="146" y="380" fill="#d8e4f0" font-size="16" font-family="Consolas, Menlo, monospace">build · learn · improve</text>
  <rect x="366" y="371" width="110" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="48;110;48" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
