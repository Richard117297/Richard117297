<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Veterinary Management System project card</title>
  <desc id="description">Veterinary Management System. TEAM. ERP-STYLE. I contributed to the development of an academic ERP-style management system for veterinary clinics, supporting software implementation, interface design, and desktop application structure for a complete operational solution.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="54%" stop-color="#081421" />
      <stop offset="100%" stop-color="#102238" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#2dd4bf" />
      <stop offset="78%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27415e" stroke-width="1" opacity="0.34" />
    </pattern>
    <clipPath id="frameClip"><rect width="1200" height="420" rx="20" /></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#background)" />
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#345778" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="url(#grid)" opacity="0.18" />
  <rect x="28" y="24" width="1144" height="372" rx="17" fill="#060d17" fill-opacity="0.64" stroke="#2f648b" stroke-width="1.4" />
  <rect x="29" y="25" width="1142" height="370" rx="16" fill="none" stroke="#34d399" stroke-opacity="0.22" />
  <g clip-path="url(#frameClip)">
    <rect x="0" y="-67" width="1200" height="67" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 487" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="28" y="393" width="1144" height="3" rx="1.5" fill="url(#edge)" opacity="0.5" />
  <circle cx="52" cy="56" r="4.5" fill="#34d399" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <text x="68" y="62" fill="#34d399" font-size="16" font-weight="800" font-family="Consolas, Menlo, monospace">[05] project.veterinary-management</text>
  <text x="52" y="88" fill="#8fa3ba" font-size="13" font-family="Consolas, Menlo, monospace">richard@portfolio:~/projects$ inspect project.veterinary-management</text>
  <text x="1148" y="62" fill="#5f7590" font-size="12" text-anchor="end" font-family="Consolas, Menlo, monospace">PROJECT // READY</text>
  <line x1="52" y1="105" x2="1148" y2="105" stroke="#315474" stroke-width="1" />
  <line x1="52" y1="105" x2="210" y2="105" stroke="url(#edge)" stroke-width="2" />
  <text x="58" y="146" fill="#5f7590" font-size="13" font-family="Consolas, Menlo, monospace">PROJECT 05 // VERIFIED</text>
<text x="58" y="188" fill="#f0f6fc" font-size="33" font-weight="800" text-anchor="start" font-family="Segoe UI, Ubuntu, Arial, sans-serif">
    <tspan x="58" dy="0">Veterinary Management System</tspan>
  </text>
  <rect x="790" y="151" width="105" height="30" rx="15" fill="#0b1726" stroke="#34d399" stroke-opacity="0.72" />
  <text x="842.5" y="171" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle" font-family="Consolas, Menlo, monospace">TEAM</text>
  <rect x="907" y="151" width="109" height="30" rx="15" fill="#0b1726" stroke="#34d399" stroke-opacity="0.72" />
  <text x="961.5" y="171" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle" font-family="Consolas, Menlo, monospace">ERP-STYLE</text>
  <text x="58" y="232" fill="#34d399" font-size="13" font-weight="800" font-family="Consolas, Menlo, monospace">DESCRIPTION.LOG</text>
<text x="58" y="261" fill="#d3ddea" font-size="17" font-weight="400" text-anchor="start" font-family="Segoe UI, Ubuntu, Arial, sans-serif">
    <tspan x="58" dy="0">I contributed to the development of an academic ERP-style management system for veterinary clinics, supporting</tspan>
    <tspan x="58" dy="29">software implementation, interface design, and desktop application structure for a complete operational solution.</tspan>
  </text>
  <text x="1142" y="368" fill="#5f7590" font-size="12" text-anchor="end" font-family="Consolas, Menlo, monospace">LINKS // LIVE BELOW</text>

</svg>
