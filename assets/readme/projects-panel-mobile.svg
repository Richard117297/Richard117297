  <rect x="50" y="264" width="500" height="62" rx="10" fill="#0b1726" stroke="#3b82f6" stroke-opacity="0.36" />
  <circle cx="74" cy="294" r="7" fill="#3b82f6" />
  <text x="96" y="284" fill="#3b82f6" font-size="15" font-weight="800" font-family="Consolas, Menlo, monospace">[03]</text>
<text x="154" y="284" fill="#f0f6fc" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Ubuntu, Arial, sans-serif">
    <tspan x="154" dy="0">UPB Educational Credit Simulator</tspan>
  </text>
  <rect x="50" y="337" width="500" height="62" rx="10" fill="#0b1726" stroke="#8b5cf6" stroke-opacity="0.36" />
  <circle cx="74" cy="367" r="7" fill="#8b5cf6" />
  <text x="96" y="357" fill="#8b5cf6" font-size="15" font-weight="800" font-family="Consolas, Menlo, monospace">[04]</text>
<text x="154" y="357" fill="#f0f6fc" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Ubuntu, Arial, sans-serif">
    <tspan x="154" dy="0">Ruta 7 Ríos Tourism Platform</tspan>
