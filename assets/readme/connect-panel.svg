<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="275" viewBox="0 0 1200 275" role="img" aria-labelledby="title description">
  <title id="title">Connect with Richard</title>
  <desc id="description">Connect through GitHub, LinkedIn, Gmail, Instagram, and Facebook.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="54%" stop-color="#081421" />
      <stop offset="100%" stop-color="#102238" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#2dd4bf" />
      <stop offset="78%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27415e" stroke-width="1" opacity="0.34" />
    </pattern>
    <clipPath id="frameClip"><rect width="1200" height="275" rx="20" /></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="275" rx="20" fill="url(#background)" />
  <rect x="1" y="1" width="1198" height="273" rx="19" fill="none" stroke="#345778" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="273" rx="19" fill="url(#grid)" opacity="0.18" />
  <rect x="28" y="24" width="1144" height="227" rx="17" fill="#060d17" fill-opacity="0.64" stroke="#2f648b" stroke-width="1.4" />
  <rect x="29" y="25" width="1142" height="225" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity="0.22" />
  <g clip-path="url(#frameClip)">
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 335" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="28" y="248" width="1144" height="3" rx="1.5" fill="url(#edge)" opacity="0.5" />
  <circle cx="52" cy="56" r="4.5" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <text x="68" y="62" fill="#2dd4bf" font-size="16" font-weight="800" font-family="Consolas, Menlo, monospace">CONNECT // AVAILABLE</text>
  <text x="52" y="88" fill="#8fa3ba" font-size="13" font-family="Consolas, Menlo, monospace">richard@portfolio:~$ open contacts</text>
  <text x="1148" y="62" fill="#5f7590" font-size="12" text-anchor="end" font-family="Consolas, Menlo, monospace">5 CHANNELS // READY</text>
  <line x1="52" y1="105" x2="1148" y2="105" stroke="#315474" stroke-width="1" />
  <line x1="52" y1="105" x2="210" y2="105" stroke="url(#edge)" stroke-width="2" />
  <rect x="52" y="133" width="198" height="82" rx="13" fill="#0b1726" stroke="#f0f6fc" stroke-opacity="0.42" />
  <circle cx="90" cy="174" r="17" fill="#07111f" stroke="#f0f6fc" />
  <text x="90" y="179" fill="#f0f6fc" font-size="11" font-weight="800" text-anchor="middle" font-family="Consolas, Menlo, monospace">GH</text>
  <text x="121" y="180" fill="#f0f6fc" font-size="17" font-weight="700" font-family="Segoe UI, Ubuntu, Arial, sans-serif">GitHub</text>
  <circle cx="230" cy="151" r="4" fill="#f0f6fc">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <rect x="272" y="133" width="198" height="82" rx="13" fill="#0b1726" stroke="#60a5fa" stroke-opacity="0.42" />
  <circle cx="310" cy="174" r="17" fill="#07111f" stroke="#60a5fa" />
  <text x="310" y="179" fill="#60a5fa" font-size="11" font-weight="800" text-anchor="middle" font-family="Consolas, Menlo, monospace">IN</text>
  <text x="341" y="180" fill="#f0f6fc" font-size="17" font-weight="700" font-family="Segoe UI, Ubuntu, Arial, sans-serif">LinkedIn</text>
  <circle cx="450" cy="151" r="4" fill="#60a5fa">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.15s" repeatCount="indefinite" />
  </circle>
  <rect x="492" y="133" width="198" height="82" rx="13" fill="#0b1726" stroke="#f87171" stroke-opacity="0.42" />
  <circle cx="530" cy="174" r="17" fill="#07111f" stroke="#f87171" />
  <text x="530" y="179" fill="#f87171" font-size="11" font-weight="800" text-anchor="middle" font-family="Consolas, Menlo, monospace">GM</text>
  <text x="561" y="180" fill="#f0f6fc" font-size="17" font-weight="700" font-family="Segoe UI, Ubuntu, Arial, sans-serif">Gmail</text>
  <circle cx="670" cy="151" r="4" fill="#f87171">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <rect x="712" y="133" width="198" height="82" rx="13" fill="#0b1726" stroke="#c084fc" stroke-opacity="0.42" />
  <circle cx="750" cy="174" r="17" fill="#07111f" stroke="#c084fc" />
  <text x="750" y="179" fill="#c084fc" font-size="11" font-weight="800" text-anchor="middle" font-family="Consolas, Menlo, monospace">IG</text>
  <text x="781" y="180" fill="#f0f6fc" font-size="17" font-weight="700" font-family="Segoe UI, Ubuntu, Arial, sans-serif">Instagram</text>
  <circle cx="890" cy="151" r="4" fill="#c084fc">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.8499999999999996s" repeatCount="indefinite" />
  </circle>
  <rect x="932" y="133" width="198" height="82" rx="13" fill="#0b1726" stroke="#38bdf8" stroke-opacity="0.42" />
  <circle cx="970" cy="174" r="17" fill="#07111f" stroke="#38bdf8" />
  <text x="970" y="179" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle" font-family="Consolas, Menlo, monospace">FB</text>
  <text x="1001" y="180" fill="#f0f6fc" font-size="17" font-weight="700" font-family="Segoe UI, Ubuntu, Arial, sans-serif">Facebook</text>
  <circle cx="1110" cy="151" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4.199999999999999s" repeatCount="indefinite" />
  </circle>

