<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="22" viewBox="0 0 1000 22" role="img" aria-labelledby="title description">
  <title id="title">Neon section divider</title>
  <desc id="description">A cyan, teal, blue, and violet technical divider.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="24%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="76%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="30" y="10" width="940" height="2" rx="1" fill="url(#line)" />
  <circle cx="500" cy="11" r="4" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="110" cy="11" r="2.5" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cx" values="110;500;890" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="890" cy="11" r="2.5" fill="#8b5cf6" filter="url(#glow)">
    <animate attributeName="cx" values="890;500;110" dur="8.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.75;0" dur="8.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="330" cy="11" r="2" fill="#22d3ee">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="670" cy="11" r="2" fill="#8b5cf6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" begin="1s" repeatCount="indefinite" />
  </circle>
</svg>
