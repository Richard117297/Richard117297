<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Richard portfolio terminal</title>
  <desc id="description">&gt; build --clean. &gt; learn --continuous. &gt; improve --together. &gt; collaborate --always. &gt; keep --learning. status: always learning.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="54%" stop-color="#081421" />
      <stop offset="100%" stop-color="#102238" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#2dd4bf" />
      <stop offset="78%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27415e" stroke-width="1" opacity="0.34" />
    </pattern>
    <clipPath id="frameClip"><rect width="1200" height="430" rx="20" /></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="20" fill="url(#background)" />
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="none" stroke="#345778" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="url(#grid)" opacity="0.18" />
  <rect x="28" y="24" width="1144" height="382" rx="17" fill="#060d17" fill-opacity="0.64" stroke="#2f648b" stroke-width="1.4" />
  <rect x="29" y="25" width="1142" height="380" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity="0.22" />
  <g clip-path="url(#frameClip)">
    <rect x="0" y="-69" width="1200" height="69" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 499" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="28" y="403" width="1144" height="3" rx="1.5" fill="url(#edge)" opacity="0.5" />
  <circle cx="52" cy="56" r="4.5" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <text x="68" y="62" fill="#2dd4bf" font-size="16" font-weight="800" font-family="Consolas, Menlo, monospace">TERMINAL // CONTINUOUS MODE</text>
  <text x="52" y="88" fill="#8fa3ba" font-size="13" font-family="Consolas, Menlo, monospace">richard@portfolio:~$ run mindset --persistent</text>
  <text x="1148" y="62" fill="#5f7590" font-size="12" text-anchor="end" font-family="Consolas, Menlo, monospace">SESSION // ACTIVE</text>
  <line x1="52" y1="105" x2="1148" y2="105" stroke="#315474" stroke-width="1" />
  <line x1="52" y1="105" x2="210" y2="105" stroke="url(#edge)" stroke-width="2" />
  <circle cx="58" cy="139" r="6" fill="#ff5f57" />
  <circle cx="80" cy="139" r="6" fill="#febc2e" />
  <circle cx="102" cy="139" r="6" fill="#28c840" />
  <text x="132" y="145" fill="#8fa3ba" font-size="13" font-family="Consolas, Menlo, monospace">richard@portfolio</text>
  <line x1="52" y1="161" x2="1148" y2="161" stroke="#294866" />
  <text x="72" y="201" fill="#22d3ee" font-size="18" font-weight="700" font-family="Consolas, Menlo, monospace">&gt; build --clean</text>
  <rect x="1020" y="188" width="90" height="4" rx="2" fill="#22d3ee" opacity="0.28" />
  <text x="72" y="236" fill="#2dd4bf" font-size="18" font-weight="700" font-family="Consolas, Menlo, monospace">&gt; learn --continuous</text>
  <rect x="1020" y="223" width="90" height="4" rx="2" fill="#2dd4bf" opacity="0.28" />
  <text x="72" y="271" fill="#3b82f6" font-size="18" font-weight="700" font-family="Consolas, Menlo, monospace">&gt; improve --together</text>
  <rect x="1020" y="258" width="90" height="4" rx="2" fill="#3b82f6" opacity="0.28" />
  <text x="72" y="306" fill="#8b5cf6" font-size="18" font-weight="700" font-family="Consolas, Menlo, monospace">&gt; collaborate --always</text>
  <rect x="1020" y="293" width="90" height="4" rx="2" fill="#8b5cf6" opacity="0.28" />
  <text x="72" y="341" fill="#34d399" font-size="18" font-weight="700" font-family="Consolas, Menlo, monospace">&gt; keep --learning</text>
  <rect x="1020" y="328" width="90" height="4" rx="2" fill="#34d399" opacity="0.28" />
  <text x="72" y="395" fill="#8fa3ba" font-size="14" font-family="Consolas, Menlo, monospace">status: always learning...</text>
  <rect x="305" y="378" width="10" height="20" rx="1" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.4s" repeatCount="indefinite" />
  </rect>

</svg>
