<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="573" viewBox="0 0 600 573" role="img" aria-labelledby="title description">
  <title id="title">Ruta 7 Ríos Tourism Platform project card</title>
  <desc id="description">Ruta 7 Ríos Tourism Platform. TRACK 2. TOURISM PLATFORM. I contributed as part of the development team for Ruta 7 Ríos, an academic tourism platform for Santiago de Cali developed within Track 2 of the integrator project. My work supported the public and informative web experience, visual identity, and user-oriented presentation of cultural, natural, salsa, and gastronomic tourism content within a broader solution that also involved backend services, infrastructure, connectivity, and deployment evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="54%" stop-color="#081421" />
      <stop offset="100%" stop-color="#102238" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#2dd4bf" />
      <stop offset="78%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27415e" stroke-width="1" opacity="0.34" />
    </pattern>
    <clipPath id="frameClip"><rect width="600" height="573" rx="20" /></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="573" rx="20" fill="url(#background)" />
  <rect x="1" y="1" width="598" height="571" rx="19" fill="none" stroke="#345778" stroke-width="2" />
  <rect x="1" y="1" width="598" height="571" rx="19" fill="url(#grid)" opacity="0.18" />
  <rect x="28" y="24" width="544" height="525" rx="17" fill="#060d17" fill-opacity="0.64" stroke="#2f648b" stroke-width="1.4" />
  <rect x="29" y="25" width="542" height="523" rx="16" fill="none" stroke="#8b5cf6" stroke-opacity="0.22" />
  <g clip-path="url(#frameClip)">
