<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" role="img" aria-labelledby="title description">
  <title id="title">Animated technical project accent</title>
  <desc id="description">A subtle cyan, teal, blue, and violet line with moving light points.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="20%" stop-color="#22d3ee" stop-opacity="0.65" />
      <stop offset="44%" stop-color="#2dd4bf" stop-opacity="0.7" />
      <stop offset="68%" stop-color="#3b82f6" stop-opacity="0.65" />
      <stop offset="86%" stop-color="#8b5cf6" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-80%" y="-400%" width="260%" height="900%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="24" y="6" width="952" height="1.5" rx="0.75" fill="url(#accent)" />
  <circle cx="90" cy="6.75" r="2.2" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cx" values="90;500;910" dur="6.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0" dur="6.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="910" cy="6.75" r="1.8" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="cx" values="910;500;90" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite" />
  </circle>
</svg>
