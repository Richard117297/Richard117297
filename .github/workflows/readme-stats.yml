name: Update README Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: readme-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate README stats SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/generate-readme-stats.mjs

      - name: Validate generated SVGs
        shell: bash
        run: |
          set -euo pipefail

          for file in assets/generated/stats.svg assets/generated/top-langs.svg assets/generated/detailed-stats.svg; do
            echo "Validating $file"
            test -s "$file"
            grep -q "<svg" "$file"

            if grep -Eiq "Something went wrong|Error fetching|Rate Limit|API rate limit|Bad credentials" "$file"; then
              echo "::error file=$file::Generated SVG contains an error response."
              sed -n '1,40p' "$file"
              exit 1
            fi

            bytes="$(wc -c < "$file")"
            echo "$file generated successfully (${bytes} bytes)"
          done

      - name: Show git diff summary
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat -- README.md assets/generated/stats.svg assets/generated/top-langs.svg assets/generated/detailed-stats.svg || true

      - name: Commit generated cards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/generated/stats.svg assets/generated/top-langs.svg assets/generated/detailed-stats.svg

          if git diff --cached --quiet; then
            echo "No README stats changes to commit."
            exit 0
          fi

          cache_key="${GITHUB_RUN_NUMBER:-manual}"
          perl -0pi -e "s#\\./assets/generated/stats\\.svg(?:\\?v=[^\"]*)?#./assets/generated/stats.svg?v=${cache_key}#g; s#\\./assets/generated/top-langs\\.svg(?:\\?v=[^\"]*)?#./assets/generated/top-langs.svg?v=${cache_key}#g; s#\\./assets/generated/detailed-stats\\.svg(?:\\?v=[^\"]*)?#./assets/generated/detailed-stats.svg?v=${cache_key}#g" README.md

          git add README.md assets/generated/stats.svg assets/generated/top-langs.svg assets/generated/detailed-stats.svg
          git commit -m "chore: update README stats cards"
          git push
